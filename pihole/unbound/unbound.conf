server:
    # Allow queries from Pi-hole network
    access-control: 172.20.0.0/24 allow
    access-control: 127.0.0.0/8 allow

    # Harden against spoofing
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: yes

    # Use 0x20-encoded random bits in the query
    use-caps-for-id: no

    # Reduce EDNS reassembly buffer size
    edns-buffer-size: 1232

    # Prefetch cached elements
    prefetch: yes
    prefetch-key: yes

    # Minimum TTL for cache entries
    cache-min-ttl: 3600
    cache-max-ttl: 86400

    # Privacy settings
    hide-identity: yes
    hide-version: yes

    # Faster timeouts
    serve-expired: yes
    serve-expired-ttl: 86400

    # Private addresses (RFC1918)
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8

   local-zone: "lan." transparent
   local-data: "jellyfin.lan. IN A 192.168.8.235"
   local-data: "jellyfin. IN A 192.168.8.235"

   local-data: "omv.lan. IN A 192.168.8.146"
   local-data: "omv. IN A 192.168.8.146"

