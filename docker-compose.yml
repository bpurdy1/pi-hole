services:
  unbound:
    container_name: unbound
    image: klutchell/unbound:latest
    restart: unless-stopped
    volumes:
      - ./unbound/unbound.conf:/etc/unbound/custom.conf.d/pi-hole.conf:ro
    networks:
      pihole-net:
        ipv4_address: ${UNBOUND_IP:-172.20.0.2}
    healthcheck:
      test: ["CMD", "drill", "@127.0.0.1", "pi-hole.net"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    hostname: pihole
    depends_on:
      - unbound
    env_file:
      - .env
    environment:
      - PIHOLE_DNS_=${UNBOUND_IP:-172.20.0.2}#53
    ports:
      - "${PRIMARY_DNS_PORT:-53}:53/tcp"
      - "${PRIMARY_DNS_PORT:-53}:53/udp"
      - "${PRIMARY_WEB_PORT:-80}:80/tcp"
      - "${PRIMARY_HTTPS_PORT:-443}:443/tcp"
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    networks:
      pihole-net:
        ipv4_address: ${PRIMARY_IP:-172.20.0.10}
    dns:
      - 127.0.0.1
      - ${UNBOUND_IP:-172.20.0.2}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "dig", "+short", "@127.0.0.1", "google.com"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  pihole-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${PIHOLE_SUBNET:-172.20.0.0/24}
